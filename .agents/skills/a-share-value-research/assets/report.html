<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title>
<style>
:root{color-scheme:light;--ink:#111;--muted:#666;--accent:#8a631d;--line:#ddd}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:16px/1.9 "Microsoft YaHei","PingFang SC",sans-serif}header{max-width:1120px;margin:0 auto;padding:30px 50px 16px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}header b{color:var(--accent);letter-spacing:2px}main{max-width:1120px;margin:0 auto 70px;background:white;padding:30px 40px}h1{font-size:34px;line-height:1.5;margin:0 0 25px}h2{font-size:25px;margin:45px 0 20px;border-bottom:2px solid var(--ink);padding-bottom:8px}h3{font-size:19px;margin-top:25px}p{margin:14px 0}p:has(>strong:first-child){line-height:1.9}p.chapter-sources{font-size:13px;color:var(--muted);font-style:italic}p.callout{background:#f6f7f9;border-left:4px solid #ad2525;padding:16px 22px;border-radius:0 6px 6px 0}.stars{color:#ca9b48;white-space:nowrap}strong{font-weight:700}a{color:var(--accent);overflow-wrap:anywhere;text-decoration:none}a:hover{text-decoration:underline}.table-wrap{overflow-x:auto;margin:22px 0}table{border-collapse:collapse;width:100%;font-size:14px;min-width:540px}th,td{border:1px solid var(--line);padding:12px 14px;vertical-align:top;text-align:left}th{background:#f6f7f9;font-weight:700}tr:nth-child(2n+1) td{background:#fafbfd}ul{padding-left:25px}li{margin:10px 0}.appendix{font-size:13px;color:var(--muted)}details{border-bottom:1px solid var(--line);padding:9px 0;overflow-wrap:anywhere}summary{cursor:pointer}footer{max-width:1120px;margin:auto;padding:0 50px 30px;font-size:12px;color:var(--muted)}@media(max-width:700px){header{padding:20px;flex-direction:column}main{padding:25px 20px}h1{font-size:27px}h2{font-size:22px}footer{padding:0 20px 25px}}@media print{body{background:white;font-size:11pt}header{padding:0 0 12px}main{padding:12px 0;box-shadow:none;margin:0;border:none;max-width:none}h2,h3{break-after:avoid}tr{break-inside:avoid}footer{padding:0}.table-wrap{overflow:visible}table{min-width:0;font-size:9pt}th,td{padding:7px}a{color:inherit}.appendix{break-before:page}}

header{display:none}body{color:#111;background:#fff}main{max-width:1120px;padding:40px;margin:0 auto 40px}h1{font-size:30px;margin:0 0 12px}h2{font-size:26px;margin:44px 0 18px;border-bottom:2px solid #111;padding-bottom:10px}h3{margin:26px 0 14px}table{table-layout:fixed;min-width:600px;font-size:15px}th,td{padding:12px 14px;overflow-wrap:anywhere}td strong{color:inherit}.report-tags{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.report-tag{font-size:13px;line-height:1.6;border:1px solid #ddd;border-radius:20px;padding:5px 12px;background:#fff}.tag-0{color:#246c42;background:#e9f5ee;border-color:#c8dfd0}.tag-1{color:#222}.tag-2{color:#a32b2b;background:#fbefef;border-color:#e9c8c8}.chapter-sources{font-size:13px;color:#666;font-style:italic;margin:18px 0 32px;line-height:1.8}.chapter-sources strong{font-weight:400}.chapter-sources a{color:#666}.conclusion-box{background:#f6f7f9;border-left:4px solid #ad2525;padding:10px 22px;border-radius:0 6px 6px 0}.stars{color:#c99a45;white-space:nowrap}.conclusion-box p:last-child{font-weight:700}.decision-table table td:first-child{white-space:nowrap}.decision-table tr:nth-child(2) td:last-child{color:#246c42;font-weight:600}.decision-table tr:nth-child(3) td:last-child{color:#8a631d;font-weight:600}@media(max-width:700px){main{padding:24px 18px}h1{font-size:25px}h2{font-size:22px}.report-tags{gap:7px}.report-tag{font-size:12px}table{font-size:14px}.conclusion-box{padding:8px 14px}}@media print{main{max-width:none;margin:0;padding:0}table{min-width:0}.report-tags{break-inside:avoid}.chapter-sources{margin-bottom:18px}}


html{scroll-behavior:auto}h1,h2,h3{scroll-margin-top:24px}.report-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;max-width:1420px;margin:0 auto;padding:0 24px}.report-layout main{width:100%;min-width:0;padding:40px 24px}.report-sidebar{position:sticky;top:24px;align-self:start;margin-top:40px}.report-toc{border:1px solid var(--line);border-radius:8px;padding:0;background:#fafbfd;overflow:hidden}.report-toc summary{font-size:15px;font-weight:700;padding:12px 16px;line-height:1.6;color:#333}.report-toc nav{max-height:calc(100vh - 130px);overflow-y:auto;padding:0 8px 12px;overscroll-behavior:contain}.report-toc ol{list-style:none;margin:0;padding:0}.report-toc li{margin:2px 0}.report-toc a{display:block;padding:6px 10px;border-radius:5px;font-size:13px;line-height:1.6;color:#555;text-decoration:none}.report-toc a:hover{background:#eee8de;color:#614818}.report-toc a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}.report-toc .toc-level-2 a{font-weight:700;color:#222;margin-top:6px}.report-toc .toc-level-3 a{padding-left:22px;font-size:12px}.report-toc a[aria-current="location"]{background:#eee8de;color:#614818;border-left:3px solid var(--accent)}
@media(min-width:1025px){.report-toc summary{list-style:none;pointer-events:none}.report-toc summary::-webkit-details-marker{display:none}}
@media(max-width:1024px){.report-layout{display:block;padding:0}.report-layout main{padding:24px 20px}.report-sidebar{position:sticky;top:0;margin:0;z-index:5;background:#fff;padding:8px 18px;border-bottom:1px solid var(--line)}.report-toc{background:white}.report-toc nav{max-height:55vh}h1,h2,h3{scroll-margin-top:82px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{.report-sidebar{display:none}.report-layout{display:block;padding:0;max-width:none}.report-layout main{padding:0;margin:0}html{scroll-behavior:auto}}

</style></head><body><header><b>价值投资研究报告</b><span>研究截至 @@AS_OF@@</span></header><div class="report-layout">@@TOC@@<main>@@BODY@@</main></div><footer>事实、计算、预测和假设分别标注。估值为参数条件下的研究测算，跟踪条件不代表自动交易指令。</footer><script>
(function(){
 const menu=document.querySelector('.report-toc');
 const links=Array.from(document.querySelectorAll('.report-toc a'));
 const headings=Array.from(document.querySelectorAll('main h1[id],main h2[id],main h3[id]'));
 const narrow=window.matchMedia('(max-width:1024px)');
 const syncMenu=()=>{menu.open=!narrow.matches;};
 syncMenu();narrow.addEventListener('change',syncMenu);
 links.forEach(link=>link.addEventListener('click',()=>{if(narrow.matches)menu.open=false;}));
 let pending=false;
 const highlight=()=>{
  let current=headings[0];
  for(const heading of headings){if(heading.getBoundingClientRect().top<110)current=heading;else break;}
  links.forEach(link=>{if(current&&link.hash==='#'+current.id)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current');});
  pending=false;
 };
 window.addEventListener('scroll',()=>{if(!pending){pending=true;requestAnimationFrame(highlight);}},{passive:true});
 highlight();
})();
</script></body></html>
